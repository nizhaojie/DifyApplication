app:
  description: 为留学生提供海外医疗、交通、住宿、安全和日常生活支持。
  icon: globe_with_meridians
  icon_background: '#DBEAFE'
  mode: advanced-chat
  name: 海外生活支持助手
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: 你好，我可以协助解答医疗、交通、住宿、安全和日常生活问题。请告诉我所在国家或城市。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    suggested_questions:
      - 在英国感冒了应该怎么就医？
      - 曼彻斯特如何乘坐公交？
      - 遇到紧急情况该怎么办？
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - data:
          isInLoop: false
          sourceType: start
          targetType: llm
        id: start-to-life-llm
        source: start
        sourceHandle: source
        target: life_llm
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInLoop: false
          sourceType: llm
          targetType: answer
        id: life-llm-to-answer
        source: life_llm
        sourceHandle: source
        target: answer
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: 接收学生问题。
          selected: false
          title: 开始
          type: start
          variables: []
        height: 54
        id: start
        position:
          x: 80
          y: 280
        positionAbsolute:
          x: 80
          y: 280
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: 基于已配置知识库提供海外生活建议。
          memory:
            query_prompt_template: '当前用户问题：{{#sys.query#}}'
            role_prefix:
              assistant: 助手
              user: 学生
            window:
              enabled: true
              size: 10
          model:
            completion_params:
              temperature: 0.3
            mode: chat
            name: gpt-4o-mini
            provider: openai
          prompt_template:
            - id: life-system-prompt
              role: system
              text: |
                你是留学生海外生活支持助手。使用清晰、务实的中文回答医疗、交通、住宿、安全、通信、银行和校园生活问题。

                先确认学生所在国家或城市；如果信息不足，先提一个简短的澄清问题。优先根据本应用挂接的知识库回答，并说明信息适用的国家或地区。不要编造政策、收费、机构联系方式或紧急电话号码。

                对紧急危险、生命安全或正在发生的犯罪，明确建议立即联系当地紧急服务和身边可信任的人；对医疗问题仅提供一般性就医路径，不替代专业诊疗。
          selected: false
          title: 海外生活回应
          type: llm
          variables: []
          vision:
            enabled: false
        height: 98
        id: life_llm
        position:
          x: 400
          y: 258
        positionAbsolute:
          x: 400
          y: 258
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          answer: '{{#life_llm.text#}}'
          desc: 返回海外生活支持回复。
          selected: false
          title: 回复
          type: answer
          variables: []
        height: 104
        id: answer
        position:
          x: 720
          y: 255
        positionAbsolute:
          x: 720
          y: 255
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
