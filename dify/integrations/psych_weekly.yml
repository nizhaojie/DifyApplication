version: "0.7.0"
kind: app
app:
  name: "学生心理健康周报洞察"
  description: "吃 FastAPI 聚合 JSON，只写学生心理健康周报的叙述与疏导建议。不查库、不重算人数、不引用对话原话或预警原句。"
  icon: "🌿"
  icon_type: emoji
  icon_background: "#E8F5E9"
  mode: workflow
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
      - id: start
        type: custom
        data:
          type: start
          title: "聚合结果"
          variables:
            - label: "聚合 JSON"
              variable: aggregates
              type: paragraph
              required: true
              max_length: 100000
        position: {x: 40, y: 240}
        positionAbsolute: {x: 40, y: 240}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
      - id: narrate
        type: custom
        data:
          type: llm
          title: "写洞察"
          model:
            provider: langgenius/openai/openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.2
          prompt_template:
            - id: insight-system
              role: system
              text: |
                你为管理者撰写「学生心理健康周报」的洞察。只写叙述与疏导建议，不重算、不改写人数和名单。

                输入是 FastAPI 已算好的 JSON。recorded_student_count、emotion_tags、average_emotion_score、week_risk_count、week_risk_students、watchlist_count、watchlist_students、approaching_nodes、insight_detail 都是事实。insight_detail 最多五十条，本周风险学生优先，人数仍以全量为准。

                规则：
                - 本周风险学生与持续关注学生分列，不要把两个人数加总或混成一个指标。
                - 只使用姓名、风险等级、情绪标签。禁止引用、复述或改写任何对话原话、交互全文、预警原句。输入里也不会有这些字段。
                - 节点临近只根据 approaching_nodes。名单为空时明确说没有考务截止日期落在周期前后各七天内，禁止编造开学季、考试周或其他季节。
                - 若 recorded_student_count、week_risk_count、watchlist_count 均为 0 且 approaching_nodes 为空：这是空报告，不是失败。overview_narrative 必须包含「本周无人有心理记录」。suggested_action 仍要给一条可执行的日常关怀建议。
                - 若仍有持续关注或节点临近，不要写成空报告，也不要说没有需要持续关注的学生。
                - 疏导建议只来自你的洞察，至少一条，且不引用原话。
                - 只输出一个 JSON 对象，不要 Markdown，不要 HTML，不要额外字段。

                JSON 键（值都是字符串）：
                overview_narrative, week_risk_narrative, watchlist_narrative, approaching_node_narrative, suggested_action
            - id: insight-user
              role: user
              text: "{{#start.aggregates#}}"
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
        position: {x: 360, y: 240}
        positionAbsolute: {x: 360, y: 240}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 98
      - id: end
        type: custom
        data:
          type: end
          title: "洞察 JSON"
          outputs:
            - variable: insight
              value_selector: [narrate, text]
              value_type: string
        position: {x: 680, y: 240}
        positionAbsolute: {x: 680, y: 240}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
    edges:
      - id: start-source-narrate-target
        source: start
        sourceHandle: source
        target: narrate
        targetHandle: target
        type: custom
        data: {sourceType: start, targetType: llm, isInIteration: false, isInLoop: false}
      - id: narrate-source-end-target
        source: narrate
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        data: {sourceType: llm, targetType: end, isInIteration: false, isInLoop: false}
    viewport: {x: 0, y: 0, zoom: 0.8}
