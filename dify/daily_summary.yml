version: "0.7.0"
kind: app
app:
  name: "员工日报智能汇总洞察"
  description: "吃 FastAPI 聚合 JSON，只写员工日报智能汇总的跨人提炼与协调建议。不查库、不重算覆盖率、不把未提交当成效。"
  icon: "📝"
  icon_type: emoji
  icon_background: "#D1E4FF"
  mode: workflow
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
      - id: start
        type: custom
        data:
          type: start
          title: "聚合结果"
          variables:
            - label: "聚合 JSON"
              variable: aggregates
              type: paragraph
              required: true
              max_length: 100000
        position: {x: 40, y: 240}
        positionAbsolute: {x: 40, y: 240}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
      - id: narrate
        type: custom
        data:
          type: llm
          title: "写洞察"
          model:
            provider: langgenius/openai/openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.2
          prompt_template:
            - id: insight-system
              role: system
              text: |
                你为管理者撰写「员工日报智能汇总」的洞察。日与周是同一报告种类的周期粒度。只写跨人提炼与建议，不重算、不改写覆盖率数字、名单和人数。

                输入是 FastAPI 已算好的 JSON。coverage.expected_count、submitted_count、missing_count、expected、submitted、missing、insight_detail 都是事实。insight_detail 最多五十条，未提交优先，人数仍以全量为准。

                规则：
                - 覆盖率分母是应提交人员（员工、管理者、组长）；学生与系统管理员不在分母里。不要把分母改成全部用户。
                - 只根据 submitted 里的已提交日报提炼核心进展、关键产出、潜在风险。草稿和缺失是未提交，只谈覆盖率，不当作成效或能力问题。
                - 报告只出员工姓名，不要编造跳转、工号或未出现的人。
                - 若 submitted_count 为 0：这是空报告，不是失败。coverage_narrative 必须包含「无人提交日报」。suggested_action 仍要给一条可执行的补交/提醒建议。
                - 至少一条资源与协调建议。
                - 只输出一个 JSON 对象，不要 Markdown，不要 HTML，不要额外字段。

                JSON 键（值都是字符串）：
                coverage_narrative, progress_narrative, output_narrative, risk_narrative, suggested_action
            - id: insight-user
              role: user
              text: "{{#start.aggregates#}}"
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
        position: {x: 360, y: 240}
        positionAbsolute: {x: 360, y: 240}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 98
      - id: end
        type: custom
        data:
          type: end
          title: "洞察 JSON"
          outputs:
            - variable: insight
              value_selector: [narrate, text]
              value_type: string
        position: {x: 680, y: 240}
        positionAbsolute: {x: 680, y: 240}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
    edges:
      - id: start-source-narrate-target
        source: start
        sourceHandle: source
        target: narrate
        targetHandle: target
        type: custom
        data: {sourceType: start, targetType: llm, isInIteration: false, isInLoop: false}
      - id: narrate-source-end-target
        source: narrate
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        data: {sourceType: llm, targetType: end, isInIteration: false, isInLoop: false}
    viewport: {x: 0, y: 0, zoom: 0.8}
