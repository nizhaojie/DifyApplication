        - .JPEG
        - .PNG
        - .GIF
        - .WEBP
        - .SVG
      allowed_file_upload_methods:
        - local_file
        - remote_url
      number_limits: 3
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
          - local_file
          - remote_url
    opening_statement: ''
    suggested_questions: []
    suggested_questions_after_answer:
