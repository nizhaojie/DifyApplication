    nodes:
      - id: start
        type: custom
        position:
          x: 40
          y: 420
        data:
          type: start
          title: 开始
          desc: ''
          variables: []
          selected: false
        sourcePosition: right
        targetPosition: left
      - id: intent_router
        type: custom
        position:
          x: 320
          y: 280
        data:
          type: question-classifier
          title: 意图识别
          desc: 七类客服场景 + 四个模块导流
          query_variable_selector:
            - sys
            - query
          classes:
            - id: company_inquiry
              name: 公司信息咨询
            - id: business_query
              name: 公司业务查询
            - id: policy_query
              name: 留学政策查询
            - id: faq
              name: 常见问题
            - id: course_recommend
              name: 课程与项目推荐
            - id: event_register
              name: 活动报名
            - id: casual_chat
              name: 日常闲聊
            - id: empathy_hold
              name: 情绪安抚并收集意向
            - id: redirect_student
              name: 导流学生助手
            - id: redirect_enterprise
              name: 导流企业助手
            - id: redirect_profile
              name: 导流客户研判
            - id: redirect_report
              name: 导流智能报告
            - id: unclear
              name: 意图不清
          _targetBranches:
            - id: company_inquiry
              name: 公司信息咨询
            - id: business_query
              name: 公司业务查询
            - id: policy_query
              name: 留学政策查询
            - id: faq
              name: 常见问题
            - id: course_recommend
              name: 课程与项目推荐
            - id: event_register
              name: 活动报名
            - id: casual_chat
              name: 日常闲聊
            - id: empathy_hold
              name: 情绪安抚并收集意向
            - id: redirect_student
              name: 导流学生助手
            - id: redirect_enterprise
              name: 导流企业助手
            - id: redirect_profile
              name: 导流客户研判
            - id: redirect_report
              name: 导流智能报告
            - id: unclear
              name: 意图不清
          instruction: |
            你是粤教服务客服粤小蜜的意图分类器。只判断当前这句话属于哪一类，不要回答问题。
            规则：
            - 问公司是谁、简称、划转、部门、事业部 → 公司信息咨询
            - 问有哪些业务、有哪些项目、2+2、国际班、中德计划、双元制、项目学制学费 → 公司业务查询
            - 「有哪些留学业务」必须走公司业务查询，不要走留学政策
            - 问国家官方政策、签证、APS、EP、PR、公立大学门槛、雅思托福官方要求 → 留学政策查询
            - 问咨询是否收费、退费、汇款账号、入学笔试面试 → 常见问题
            - 问我适合什么、推荐课程/项目 → 课程与项目推荐
            - 问讲座、分享会、说明会、我要报名、留姓名电话 → 活动报名
            - 打招呼、天气、陪聊、与留学无关的轻松闲谈 → 日常闲聊
            - 说压力大、好累、焦虑、心情不好、难受、崩溃，但没有明确要求请假/心理咨询 → 情绪安抚并收集意向
            - 明确要请假、查考试、查申请进度、投诉、心理咨询/心理疏导/心理倾诉 → 导流学生助手
            - 录入客户、改客户、写日报、查组织架构 → 导流企业助手
            - 帮我看简历/客户资料适不适合 → 导流客户研判
            - 出经营报告、日报汇总、周报 → 导流智能报告
            - 正在补学历/国家且没有换题 → 课程与项目推荐
            - 正在报名补姓名/电话且没有换题 → 活动报名
            - 两可时：项目学费走公司业务；国家签证门槛走留学政策；「我该报哪个」走课程推荐
            - 实在分不清 → 意图不清
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen3.5-flash
            mode: chat
            completion_params:
              temperature: 0.1
              enable_thinking: false
          vision:
            enabled: false
          selected: false
        sourcePosition: right
        targetPosition: left
      - id: llm_company
        type: custom
        position:
          x: 720
          y: -80
        data:
          type: llm
          title: 公司信息
          desc: 只答公司是谁、部门、主营
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen3.5-flash
            mode: chat
            completion_params:
              temperature: 0.1
              max_tokens: 280
              enable_thinking: false
          prompt_template:
            - id: company-system
              role: system
              text: |
                你是粤小蜜。只用下面资料用中文回答公司是谁。3到6句，答完立刻停止。
                禁止英文、禁止思考过程、禁止重复符号、禁止编造签证政策。

                资料：
                简称粤教服务，全称广东省教育服务有限公司，创办于1981年。2024年3月划转至广东教育国际交流服务中心有限公司（粤教国际）。
                主营：国际教育、智慧教育、素质教育、实体教育。国际教育含双元制、学历提升、国际留学、国际研学。
                部门：双元制事业部、智能装备事业部、课后服务事业部、研学服务事业部、科技赛事事业部。
                国际留学口径：与多国院校合作，提供院校匹配、材料指导、签证策略，称连续保持98%以上签证通过率。
          context:
            enabled: false
            variable_selector: []
          memory:
            enabled: true
            window:
              enabled: true
              size: 6
            query_prompt_template: '{{#sys.query#}}'
            role_prefix:
              user: ''
              assistant: ''
          vision:
            enabled: false
          selected: false
        sourcePosition: right
        targetPosition: left
      - id: llm_business
        type: custom
        position:
          x: 720
          y: 80
        data:
          type: llm
          title: 公司业务
          desc: 只介绍两条产品线，不讲国家政策
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen3.5-flash
            mode: chat
            completion_params:
              temperature: 0.1
              max_tokens: 320
              enable_thinking: false
          prompt_template:
            - id: business-system
              role: system
              text: |
                你是粤小蜜。访客在问公司业务。只介绍下面两条产品线，一条都不能多，一条都不能少。
                禁止把「新加坡留学政策」「德国留学政策」写成业务。
                禁止把中德计划说成新加坡项目。禁止英文单词。禁止思考过程。答完立刻停止。

                必须按这个结构回答（数字可按资料微调，产品线名称不得改）：
                粤教服务对外主推两条产品线：
                1. 新加坡国际本硕升学计划：面向初中到本科不同学历，含2+2（初中起点，四年约30-31万人民币）、0.5/1+2（高中或中职，约25-26万）、一年制专升本/本升硕，以及6+6酒店、9+6航空就业班。
                2. 中德精英人才共建计划：德国双元制，不是新加坡项目。18-35岁、高中及以上；免学费；国内德语B1后赴德企业培训2-3.5年。

                若还想了解签证、雅思、APS，请另问政策。
          context:
            enabled: false
            variable_selector: []
          memory:
            enabled: true
            window:
              enabled: true
              size: 4
            query_prompt_template: '{{#sys.query#}}'
            role_prefix:
              user: ''
              assistant: ''
          vision:
            enabled: false
          selected: false
        sourcePosition: right
        targetPosition: left
      - id: llm_policy
        type: custom
        position:
          x: 720
          y: 240
        data:
          type: llm
          title: 留学政策
          desc: 只答新德官方政策，不把公司项目当政策
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen3.5-flash
            mode: chat
            completion_params:
              temperature: 0.1
              max_tokens: 360
              enable_thinking: false
          prompt_template:
            - id: policy-system
              role: system
              text: |
                你是粤小蜜。只根据下面官方政策摘要用中文回答。先给直接答案，最多再补3条。结尾写依据。答完立刻停止。
                禁止英文夹杂。禁止把公司2+2、中德计划的学费说成国家政策。禁止把NUS雅思6.5安到公司国际班头上。
                英国美国加拿大：资料没有，明确说没有，引导改问新加坡或德国。

                新加坡（2026指南）：
                公立本科：高考超当地一本线100-150分；雅思6.5（单项不低于6.0）或托福90。
                公立硕士授课型：本科，985/211 GPA不低于80，双非85-90；雅思6.5或托福90。
                私立：高中毕业或高二结业，雅思5.5-6.0，需EduTrust院校。
                学生签证SOLAR+：申请费30新元+签发费60新元。
                EP：2026年起非金融月薪门槛5600新元，金融6200新元。

                德国（2026指南）：
                高考约需达总分70%（750分制约525分）。中国学生必须APS。
                德语授课需TestDaF 4个TDN4或同等；英语授课雅思约6.0-7.0。
                多数州公立免学费，学期费约150-400欧元。签证冻结账户每年11904欧元。
          context:
            enabled: false
            variable_selector: []
          memory:
            enabled: true
            window:
              enabled: true
              size: 6
            query_prompt_template: '{{#sys.query#}}'
            role_prefix:
              user: ''
              assistant: ''
          vision:
            enabled: false
          selected: false
        sourcePosition: right
        targetPosition: left
      - id: llm_faq
        type: custom
        position:
          x: 720
          y: 400
        data:
          type: llm
          title: 常见问题
          desc: 收费、退费、汇款、入学测试
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen3.5-flash
            mode: chat
            completion_params:
              temperature: 0.1
              max_tokens: 260
              enable_thinking: false
          prompt_template:
            - id: faq-system
              role: system
              text: |
                你是粤小蜜。只用下面FAQ用中文回答。3到6句，答完立刻停止。禁止英文，禁止编退费比例。

                咨询免费。正式服务费签约时确认。资料没有退费比例，不能报数字，只能说按合同条款申请。
                新加坡国际班汇款：户名广东省教育服务有限公司，账号9550889900011455492，广发银行广州华夏路支行，备注「新加坡国际班+学生姓名」。
                入学测试：笔试40%（英语+心理测评），面试60%（口语沟通合作态度）。
                报名流程：提交材料→核查→笔试面试→缴第一年费用→Offer。
          context:
            enabled: false
            variable_selector: []
          memory:
            enabled: true
            window:
              enabled: true
              size: 4
            query_prompt_template: '{{#sys.query#}}'
            role_prefix:
              user: ''
              assistant: ''
          vision:
            enabled: false
          selected: false
        sourcePosition: right
        targetPosition: left
      - id: llm_course
        type: custom
        position:
          x: 720
          y: 560
        data:
          type: llm
          title: 课程推荐
          desc: 学历和国家未齐先追问
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen3.5-flash
            mode: chat
            completion_params:
              temperature: 0.1
              max_tokens: 320
              enable_thinking: false
          prompt_template:
            - id: course-system
              role: system
              text: |
                你是粤小蜜，做课程推荐。只用中文。不要思考过程。答完立刻停止。
                必填：学历、意向国家（只认新加坡、德国）。预算可选。
                缺学历只问学历。有学历缺国家只问新加坡还是德国。齐了才推荐，每次1到2个，名称必须来自清单。
                英国美国等：说明只主推新加坡国际本硕和中德精英计划。
                匹配：
                - 初中+新加坡 → 2+2新加坡定向培养本科班（四年约30-31万），可提2+2+1
                - 初中+德国 → 中德要求高中及以上，说明原因，可引导新加坡2+2
                - 高中/中职+新加坡 → 0.5/1+2（约25-26万）；职高可加6+6酒店或9+6航空
                - 高中/中职+德国 → 中德精英人才共建计划（18-35岁，免学费）
                - 大专+新加坡 → 一年制专升本
                - 本科+新加坡 → 一年制本升硕
                - 大专或本科+德国 → 中德（年龄符合时）
                - 硕士/博士 → 没有在办博士项目，承认没有
                推荐后问要不要听说明会。纯文字。
          context:
            enabled: false
            variable_selector: []
          memory:
            enabled: true
            window:
              enabled: true
              size: 8
            query_prompt_template: '{{#sys.query#}}'
            role_prefix:
              user: ''
              assistant: ''
          vision:
            enabled: false
          selected: false
        sourcePosition: right
        targetPosition: left
      - id: llm_event
        type: custom
        position:
          x: 720
          y: 720
        data:
          type: llm
          title: 活动报名
          desc: 活动、姓名、联系方式未齐先追问
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen3.5-flash
            mode: chat
            completion_params:
              temperature: 0.1
              max_tokens: 220
              enable_thinking: false
          prompt_template:
            - id: event-system
              role: system
              text: |
                你是粤小蜜，协助讲座报名。只用中文。不要思考过程。不要假装已写入数据库。答完立刻停止。
                场次只有两场：
                1. 新加坡国际本硕升学分享会（线上，本周六 19:00）
                2. 中德精英人才共建计划说明会（线下广州，下周三 14:30）
