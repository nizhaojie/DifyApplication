    nodes:
      - id: start
        type: custom
        position:
          x: 40
          y: 420
        data:
          type: start
          title: 开始
          desc: ''
          variables: []
          selected: false
        sourcePosition: right
        targetPosition: left
      - id: intent_router
        type: custom
        position:
          x: 320
          y: 280
        data:
          type: question-classifier
          title: 意图识别
          desc: 七类客服场景 + 四个模块导流
          query_variable_selector:
            - sys
            - query
          classes:
            - id: company_inquiry
              name: 公司信息咨询
            - id: business_query
              name: 公司业务查询
            - id: policy_query
              name: 留学政策查询
            - id: faq
              name: 常见问题
            - id: course_recommend
              name: 课程与项目推荐
            - id: event_register
              name: 活动报名
            - id: casual_chat
              name: 日常闲聊
            - id: empathy_hold
              name: 情绪安抚并收集意向
            - id: redirect_student
              name: 导流学生助手
            - id: redirect_enterprise
              name: 导流企业助手
            - id: redirect_profile
              name: 导流客户研判
            - id: redirect_report
              name: 导流智能报告
            - id: unclear
              name: 意图不清
          _targetBranches:
            - id: company_inquiry
              name: 公司信息咨询
            - id: business_query
              name: 公司业务查询
            - id: policy_query
              name: 留学政策查询
            - id: faq
              name: 常见问题
            - id: course_recommend
              name: 课程与项目推荐
            - id: event_register
              name: 活动报名
            - id: casual_chat
              name: 日常闲聊
            - id: empathy_hold
              name: 情绪安抚并收集意向
            - id: redirect_student
              name: 导流学生助手
            - id: redirect_enterprise
              name: 导流企业助手
            - id: redirect_profile
              name: 导流客户研判
            - id: redirect_report
              name: 导流智能报告
            - id: unclear
              name: 意图不清
          instruction: |
            你是粤教服务客服粤小蜜的意图分类器。只判断当前这句话属于哪一类。
            规则：
            - 问公司是谁、简称、划转、部门、事业部 → 公司信息咨询
            - 问有哪些项目、2+2、国际班、中德计划、双元制、学制学费（项目本身） → 公司业务查询
            - 问国家官方政策、签证、APS、EP、PR、公立大学门槛、雅思托福官方要求 → 留学政策查询
            - 问咨询是否收费、退费、汇款账号、入学笔试面试 → 常见问题
            - 问我适合什么、推荐课程/项目 → 课程与项目推荐
            - 问讲座、分享会、说明会、我要报名、留姓名电话 → 活动报名
            - 打招呼、天气、陪聊、与留学无关的轻松闲谈 → 日常闲聊
            - 说压力大、好累、焦虑、心情不好、难受、崩溃，但没有明确要求请假/心理咨询 → 情绪安抚并收集意向
            - 明确要请假、查考试、查申请进度、投诉、心理咨询/心理疏导/心理倾诉 → 导流学生助手
            - 录入客户、改客户、写日报、查组织架构 → 导流企业助手
            - 帮我看简历/客户资料适不适合 → 导流客户研判
            - 出经营报告、日报汇总、周报 → 导流智能报告
            - 正在补学历/国家且没有换题 → 课程与项目推荐
            - 正在报名补姓名/电话且没有换题 → 活动报名
            - 两可时：项目学费走公司业务；国家签证门槛走留学政策；「我该报哪个」走课程推荐
            - 实在分不清 → 意图不清
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen3.5-flash
            mode: chat
            completion_params:
              temperature: 0.1
          vision:
            enabled: false
          selected: false
        sourcePosition: right
        targetPosition: left
      - id: llm_rag
        type: custom
        position:
          x: 720
          y: 40
        data:
          type: llm
          title: 知识问答
          desc: 公司 / 业务 / 政策 / FAQ，只根据资料回答
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen3.5-flash
            mode: chat
            completion_params:
              temperature: 0.2
              max_tokens: 1024
          prompt_template:
            - id: rag-system
              role: system
              text: |
                你是粤教服务的客服「粤小蜜」。只根据【资料】回答，用简洁中文。不要输出思考过程，不要用 <think>。
                当前分类：{{#intent_router.class_name#}}
                规则：
                1. 资料没有的数字、国家、退费比例，明确说没有，不能编。可接一句：欢迎补充学历、语言基础和目标方向，我按现有项目给你更贴合的建议。
                2. 英国/美国/加拿大等政策：资料没有，拒绝编造，引导改问新加坡或德国。
                3. 不要把 NUS/NTU 的雅思 6.5 安到公司 2+2 国际班头上。国际班简章未写雅思分数。
                4. 先给直接答案，再补最多 3 条关键条件，结尾标明依据。
                5. 只输出给访客看的正文。语气礼貌、不生硬。

                【资料】
                ## 公司信息
                公司简称粤教服务，全称广东省教育服务有限公司，创办于1981年。2024年3月划转至广东教育国际交流服务中心有限公司（粤教国际）。
                主营：国际教育、智慧教育、素质教育、实体教育。国际教育含双元制、学历提升、国际留学、国际研学。
                部门：双元制事业部、智能装备事业部、课后服务事业部、研学服务事业部、科技赛事事业部。
                国际留学：与美英加澳新及欧洲、亚洲多国院校合作，提供院校匹配、材料指导、签证策略，口径称连续保持98%以上签证通过率。

                ## 新加坡国际本硕升学计划
                优势：入学门槛低、学制短、费用相对低、学历回国受教育部认证。
                2+2新加坡定向培养本科班：应往届初中毕业生。国内两年（第一年学费75000元+学籍管理费50000元，第二年学费75000元）+ 新加坡两年（第三年0学费，第四年计算机约19500新币/约11万人民币，其他专业约16500新币/约10万人民币）。四年总计约30-31万人民币。第三年酒店运营6个月理论+6个月带薪实习，航空运营9+6，其他专业12个月理论。第四年直升本科，毕业获世界综合排名约200-500名大学证书。
                2+2+1：初中起点，本科后再最快1年硕，可申新加坡、港澳内地、英美澳加 TOP200 硕士。
                0.5/1+2：高二在读、应往届高中或中职中技。国内0.5/1年预科（学费100000元/年+学籍50000元）+新加坡两年（第二年0学费，第三年同上本科学费）。2.5/3年总计约25-26万人民币。
                0.5/1+2+1：高中毕业后可直升一年硕。
                一年制专升本 1-1.5 年；本升硕约1年。
                6+6酒店运营、9+6航空运营大专就业班：职高中专中职技校，年满17岁，无语言要求。实习薪资口径6000-8000元/月，就业薪资口径15000元/月以上。
                报名：提交材料→核查→笔试面试→缴第一年费用→Offer。笔试40%（英语+心理测评），面试60%（口语沟通合作态度）。
                汇款：户名广东省教育服务有限公司，账号9550889900011455492，广发银行广州华夏路支行，备注「新加坡国际班+学生姓名」。

                ## 中德精英人才共建计划
                粤教服务项目。双元制：职业学校学理论 + 企业学技能，培训2-3.5年。
                三大优势：省属教育国企直接签协议、银行全额低息贷款、全程保姆式服务。
                报名：18-35岁，高中及以上，动手与逻辑能力强，无犯罪记录，有一定德语学习能力。
                专业：医疗健康、机械制造、商贸会计、电子电器、汽车服务、酒店管理。
                流程：预审签约缴费→面试和动手测试→国内考德语B1→匹配德国企业面试→收到职业培训合同后办签证→赴德落地、入职、职业学校、考IHK/HWK证书，可就业或升学。
                特色：免学费、无学籍注册费。机电一体化津贴示例：第一年880欧/月、第二年950、第三年1030，三年约34320欧。完成后平均薪资约2100-3500欧/月。完成培训可申请德国大学，免德福、免APS。工作年限与永居以德国移民法原文为准，资料写连续工作五年可申请永居。
                德语培训：线下封闭6-12个月通过欧标B1。

                ## 新加坡留学政策（官方指南摘要，2026）
                公立本科：高考需超当地一本线100-150分，热门专业更高；A-Level建议4A；IB建议39+/42；雅思6.5（单项≥6.0）或托福90。
                公立硕士授课型：本科，985/211 GPA≥80，双非≥85-90；雅思6.5或托福90。
                私立：高中毕业或高二结业，雅思5.5-6.0，需EduTrust认证院校。
                学生签证：SOLAR+，申请费30新元+签发费60新元；中国学生审批约10个工作日。
                国际学生公立本科年学费约3.1万-3.8万新币；MOE津贴本科约50%-70%，需签3年服务协议。
                在校打工：学期内每周限16小时（需批准），假期可全职；18岁以下严禁校外兼职。
                EP：2026年起非金融月薪门槛5600新元，金融6200新元。
                PR：持有EP满1年可申请；名额上调口径见指南。资料没有的国家不要补充。

                ## 德国留学政策（官方指南摘要，2026）
                中国高中毕业生高考需达总分70%以上（750分制约525分）。211在读1学期、非211在读3学期可申请。德语授课需TestDaF 4×TDN4、DSH-2、Goethe C1/C2或telc C1；英语授课雅思6.0-7.0或托福80-100。
                中国学生必须APS。审核约4-8周（材料）或8-12周（面谈）。
                14个州公立免学费，每学期学期费150-400欧元。巴符州非欧盟每学期1500欧元。TUM本科每学期2000-3000欧元。
                签证冻结账户每年11904欧元。学生可兼职每年140个全天或280个半天。
                毕业后找工作签证18个月。欧盟蓝卡普通职业年薪≥50700欧元，紧缺职业≥45934欧元。
                德国毕业生工作签证满2年、缴24个月养老保险、德语B1可申请永居。

                ## FAQ
                咨询免费。正式服务费签约时确认。资料没有退费比例，不能报数字。
                新加坡国际班汇款账号见上。入学测试笔试40%面试60%。
          context:
            enabled: false
            variable_selector: []
          memory:
            enabled: true
            window:
              enabled: true
              size: 12
            query_prompt_template: '{{#sys.query#}}'
            role_prefix:
              user: ''
              assistant: ''
          vision:
            enabled: false
          selected: false
        sourcePosition: right
        targetPosition: left
      - id: llm_course
        type: custom
        position:
          x: 720
          y: 360
        data:
          type: llm
          title: 课程推荐
          desc: 学历和国家未齐先追问
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen3.5-flash
            mode: chat
            completion_params:
              temperature: 0.2
              max_tokens: 700
          prompt_template:
            - id: course-system
              role: system
              text: |
                你是粤小蜜，做课程推荐。不要输出思考过程。
                必填槽位：学历、意向国家（只认新加坡、德国）。预算可选。
                缺学历就只问学历。有学历缺国家就只问新加坡还是德国。齐了再推荐，每次1-2个项目，必须来自下面清单，不准发明项目名。
                访客说英国美国等：说明对外主推新加坡国际本硕和中德精英计划，其他国家课程表没有。
                匹配：
                - 初中 + 新加坡 → 2+2新加坡定向培养本科班（四年约30-31万），可顺带提 2+2+1
                - 初中 + 德国 → 中德要求高中及以上，说明原因，可引导新加坡2+2
                - 高中/中职/职高 + 新加坡 → 0.5/1+2（约25-26万）；职高可加 6+6酒店或9+6航空
                - 高中/中职 + 德国 → 中德精英人才共建计划（18-35岁，免学费）
                - 大专 + 新加坡 → 一年制专升本
                - 本科 + 新加坡 → 一年制本升硕
                - 大专或本科 + 德国 → 中德（年龄符合时）
                - 硕士/博士 → 资料没有在办博士项目，承认没有
                推荐后问要不要听对应说明会。纯文字，不要卡片。
          context:
            enabled: false
            variable_selector: []
          memory:
            enabled: true
            window:
              enabled: true
              size: 12
            query_prompt_template: '{{#sys.query#}}'
            role_prefix:
              user: ''
              assistant: ''
          vision:
            enabled: false
          selected: false
        sourcePosition: right
        targetPosition: left
      - id: llm_event
        type: custom
        position:
          x: 720
          y: 560
        data:
          type: llm
          title: 活动报名
          desc: 活动、姓名、联系方式未齐先追问
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen3.5-flash
            mode: chat
            completion_params:
              temperature: 0.2
              max_tokens: 500
          prompt_template:
            - id: event-system
              role: system
              text: |
