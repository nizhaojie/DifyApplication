app:
  description: 粤教服务对外客服粤小蜜。七类咨询分流：公司/业务/政策/FAQ分库作答，荐课与报名多轮追问，其余模块只导流。
  icon: 🍯
  icon_background: '#C41E1E'
  icon_type: emoji
  mode: advanced-chat
  name: cs-agent-main
  use_icon_as_answer_icon: false
