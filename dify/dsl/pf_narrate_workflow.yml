# Dify 工作流 DSL：pf-narrate （结构化 profile + 规则匹配中间结果 → 最终研判 JSON）
#
# 可直接通过 Dify 控制台「导入 DSL」或 POST /console/api/apps/imports
#   {mode:"yaml-content", yaml_content:<本文件内容>} 导入。
# 部署后把 API Key 填入 backend/.env 的 DIFY_NARRATE_API_KEY。
# backend services/dify_client.py 调 POST {DIFY_API_BASE}/workflows/run
#   inputs={profile, assessments, match_prompts}（均为 JSON 字符串，后端已 json.dumps），
#   读 outputs.match_result（JSON 字符串，见 _jsonish）。
#
# 三个入参均为 paragraph 类型（JSON 文本），因本租户 Dify 的 start 节点
# 不使用 object/array 变量，故后端 dify_client.narrate 将对象序列化为字符串传入。
# 模型：langgenius/tongyi/tongyi / qwen3.8-max（本租户默认凭据自动解析）。
app:
  description: 客户研判自然语言生成：profile + assessments + match_prompts → match_result JSON
  icon: 🤖
  icon_background: '#D5F5FF'
  mode: workflow
  name: pf-narrate
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start-to-llm
      source: start_node
      sourceHandle: source
      target: llm_node
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
      id: llm-to-end
      source: llm_node
      sourceHandle: source
      target: end_node
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - label: profile
          max_length: null
          options: []
          required: true
          type: paragraph
          variable: profile
        - label: assessments
          max_length: null
          options: []
          required: true
          type: paragraph
          variable: assessments
        - label: match_prompts
          max_length: null
          options: []
          required: true
          type: paragraph
          variable: match_prompts
      height: 90
      id: start_node
      position:
        x: 30
        y: 227
      positionAbsolute:
        x: 30
        y: 227
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: profile + assessments + match_prompts → match_result JSON
        title: LLM
        type: llm
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen3.8-max
          mode: chat
          completion_params:
            temperature: 0.4
            enable_thinking: false
            max_tokens: 2048
        prompt_template:
        - id: b1111111-1111-1111-1111-111111111111
          role: system
          text: |-
            你是客户画像研判顾问。依据传入的三段 JSON 产出最终研判。
            - profile：规范化客户画像（对象）。
            - assessments：规则引擎对各产品线的匹配结果数组，每项含
              {product_line, match_result(matched/partial/not_matched), match_score,
               matched_labels, candidate_programs}（candidate_programs 为
               [{programs:[专业名],category,rationale}]）。
            - match_prompts：各产品线的研判提示词（对象，键为产品线）。
            任务：
            1) 选 match_score 最高且 match_result≠not_matched 的产品线为 matched_product；
               若全部 not_matched，则 match_result=not_matched、matched_product=null、match_score=0。
            2) match_result 与 match_score 取所选产品线的值。
            3) match_reason：用中文说明命中了哪些规则(matched_labels)及为何推荐该细分专业，
               须引用传入的具体规则条目与候选专业，禁止编造规则或专业。
            4) recommended_programs：从所选产品线 candidate_programs 的 programs 中选 1-3 个
               最匹配的，按匹配度排序；无则空数组。只保留专业名(字符串)。
            防幻觉：只能引用传入数据中已有的规则与候选专业，不得臆造。
            只输出一个 JSON 对象：
            {"match_result":"matched|partial|not_matched","matched_product":<产品线或null>,
             "match_score":<0-100浮点>,"match_reason":"<中文说明>","recommended_programs":[<专业名>]}
            不要 markdown 代码围栏，不要解释文字。
        - id: b2222222-2222-2222-2222-222222222222
          role: user
          text: |-
            客户画像：
            {{#start_node.profile#}}

            规则匹配结果：
            {{#start_node.assessments#}}

            产品线提示词：
            {{#start_node.match_prompts#}}
        memory:
          window:
            enabled: false
            size: 50
          role_prefix:
            user: ''
            assistant: ''
        vision:
          enabled: false
        context:
          enabled: false
          variable_selector: []
        selected: false
        variables: []
      height: 90
      id: llm_node
      position:
        x: 334
        y: 227
      positionAbsolute:
        x: 334
        y: 227
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - variable: match_result
          value_selector:
          - llm_node
          - text
        selected: false
        title: End
        type: end
      height: 90
      id: end_node
      position:
        x: 638
        y: 227
      positionAbsolute:
        x: 638
        y: 227
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
