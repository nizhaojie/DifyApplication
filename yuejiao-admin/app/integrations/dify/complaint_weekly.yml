version: "0.7.0"
kind: app
app:
  name: "投诉处理周报洞察"
  description: "吃 FastAPI 聚合 JSON，只写投诉处理周报的叙述与建议动作。不查库、不重算人数、不重写工单分类。"
  icon: "📋"
  icon_type: emoji
  icon_background: "#FFEAD5"
  mode: workflow
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
      - id: start
        type: custom
        data:
          type: start
          title: "聚合结果"
          variables:
            - label: "聚合 JSON"
              variable: aggregates
              type: paragraph
              required: true
              max_length: 100000
        position: {x: 40, y: 240}
        positionAbsolute: {x: 40, y: 240}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
      - id: narrate
        type: custom
        data:
          type: llm
          title: "写洞察"
          model:
            provider: langgenius/openai/openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.2
          prompt_template:
            - id: insight-system
              role: system
              text: |
                你为管理者撰写「投诉处理周报」的洞察。只写叙述与建议，不重算、不改写人数、名单、分类、时效、满意度。

                输入是 FastAPI 已算好的 JSON。period_complaint_count、categories、handling、open_complaints、satisfaction、wow、yoy、insight_detail 都是事实。insight_detail 最多五十条，未决投诉优先，人数仍以全量为准。

                规则：
                - 投诉分类沿用 JSON 已有值；空已记为「其他」。不要给出新的分类，也不要建议回写工单。
                - 环比/同比若 label 为「样本不足」，就说样本不足，不要编涨跌。
                - 满意度若 label 为「暂无评价」，就说暂无评价，不要把未评价当零分。
                - 若 period_complaint_count 为 0：这是空报告，不是失败。volume_narrative 必须包含「本周无新增投诉」。suggested_action 仍要给一条可执行的维持/巡视建议。
                - 至少一条薄弱环节建议动作。
                - 只输出一个 JSON 对象，不要 Markdown，不要 HTML，不要额外字段。

                JSON 键（值都是字符串）：
                volume_narrative, category_narrative, handling_narrative, open_alert_narrative, satisfaction_narrative, suggested_action
            - id: insight-user
              role: user
              text: "{{#start.aggregates#}}"
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
        position: {x: 360, y: 240}
        positionAbsolute: {x: 360, y: 240}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 98
      - id: end
        type: custom
        data:
          type: end
          title: "洞察 JSON"
          outputs:
            - variable: insight
              value_selector: [narrate, text]
              value_type: string
        position: {x: 680, y: 240}
        positionAbsolute: {x: 680, y: 240}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
    edges:
      - id: start-source-narrate-target
        source: start
        sourceHandle: source
        target: narrate
        targetHandle: target
        type: custom
        data: {sourceType: start, targetType: llm, isInIteration: false, isInLoop: false}
      - id: narrate-source-end-target
        source: narrate
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        data: {sourceType: llm, targetType: end, isInIteration: false, isInLoop: false}
    viewport: {x: 0, y: 0, zoom: 0.8}
