version: "0.7.0"
kind: app
app:
  name: "全域客户经营分析洞察"
  description: "吃 FastAPI 聚合 JSON，只写全域客户经营分析的分组共性、路径叙述、流失归因与建议。不查库、不重算人数、不编造本周新签或本周新流失。"
  icon: "📈"
  icon_type: emoji
  icon_background: "#E3F2FD"
  mode: workflow
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
      - id: start
        type: custom
        data:
          type: start
          title: "聚合结果"
          variables:
            - label: "聚合 JSON"
              variable: aggregates
              type: paragraph
              required: true
              max_length: 100000
        position: {x: 40, y: 240}
        positionAbsolute: {x: 40, y: 240}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
      - id: narrate
        type: custom
        data:
          type: llm
          title: "写洞察"
          model:
            provider: langgenius/openai/openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.2
          prompt_template:
            - id: insight-system
              role: system
              text: |
                你为管理者撰写「全域客户经营分析」的洞察。只写叙述与建议动作，不重算、不改写人数和名单。

                输入是 FastAPI 已算好的 JSON。intent_count、signed_count、lost_count 是周期结束时的期末存量。new_intent_count 按本周期进入漏斗的时间计。wow、yoy、intent、signed、lost、insight_detail 都是事实。insight_detail 最多五十条，流失预警对象优先，人数仍以全量为准。

                规则：
                - 不要写「本周新签」「本周新流失」，也不要编造签约或流失发生额。三类客群人数是期末存量。
                - 研判对象未进漏斗，不会出现在任何客群里；不要把他们补进名单。
                - 环比/同比若 label 为「样本不足」，就说样本不足，不要编涨跌。
                - 意向特征分组与成交高价值特征都只用意向国家、学历、来源渠道。成交样本少于 2 人时，signed_narrative 必须写明「样本不足以归纳共性」，不要做价值评分模型或聚类算法。
                - 转化路径只根据 conversion_paths 里的跟进时间线加当前状态，不要虚构漏斗节点或状态流水。
                - 流失归因基于已记录的 lost_reason，原因空就说原因未记录，不要编造离开时刻。
                - 流失预警对象仍在意向客群，不是已经流失的人。
                - 若 intent_count、signed_count、lost_count、new_intent_count 均为 0：这是空报告，不是失败。overview_narrative 必须包含「没有进入漏斗」或「客群人数为零」。suggested_action 仍要给一条可执行的获客建议。
                - 至少一条建议动作，且必须落在获客、转化、挽回之一。
                - 只输出一个 JSON 对象，不要 Markdown，不要 HTML，不要额外字段。

                JSON 键（值都是字符串）：
                overview_narrative, intent_narrative, signed_narrative, lost_narrative, suggested_action
            - id: insight-user
              role: user
              text: "{{#start.aggregates#}}"
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
        position: {x: 360, y: 240}
        positionAbsolute: {x: 360, y: 240}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 98
      - id: end
        type: custom
        data:
          type: end
          title: "洞察 JSON"
          outputs:
            - variable: insight
              value_selector: [narrate, text]
              value_type: string
        position: {x: 680, y: 240}
        positionAbsolute: {x: 680, y: 240}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
    edges:
      - id: start-source-narrate-target
        source: start
        sourceHandle: source
        target: narrate
        targetHandle: target
        type: custom
        data: {sourceType: start, targetType: llm, isInIteration: false, isInLoop: false}
      - id: narrate-source-end-target
        source: narrate
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        data: {sourceType: llm, targetType: end, isInIteration: false, isInLoop: false}
    viewport: {x: 0, y: 0, zoom: 0.8}
