app:
  description: |-
    粤教企业智能助手（员工端）。业务走 FastAPI；知识库必须建两个：
    1) 企业信息+公司新人指南；2) 常见问答对。
    导入后为分类器和全部 LLM 选择已配置模型；两个知识检索节点分别绑定上述两个库。
    HTTP 默认 http://host.docker.internal:8001 （Docker 里不要用 127.0.0.1）。
  icon: 💼
  icon_background: '#FDECEC'
  icon_type: emoji
  mode: advanced-chat
  name: 粤教-企业智能助手
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: 你好，我是粤教企业助手。可以口述录入客户、查跟进、批请假、交日报；问公司简称、入职办公、IT 故障我会查知识库，没有的内容不编。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
      - 公司简称是什么？
      - 打印机在几楼？坏了找谁？
      - 张三 13800138000 想咨询美国硕士
      - 查一下李四最近跟进记录
      - 同意张三的请假
      - 我今天有什么待办？
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
