<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>脚手架 C · 对话工作台</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1612;--wood:#3a3228;--paper:#fbf6ec;--line:#d7ccb8;--mute:#7a7164;--gold:#b08948}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Noto Serif SC",Songti SC,serif;background:#e8e0d2;color:var(--ink)}
a{color:inherit;text-decoration:none}
.app{height:100vh;display:grid;grid-template-rows:56px 1fr}
.top{background:#1a1612;color:#f6efe3;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.brand{display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:#6fbf73;box-shadow:0 0 0 4px rgba(111,191,115,.15)}
.brand b{font-family:"ZCOOL XiaoWei",serif;font-weight:400;font-size:20px;letter-spacing:.14em}
.brand span{font-family:"IBM Plex Mono",monospace;font-size:11px;color:#b3a790}
.top a{font-family:"IBM Plex Mono",monospace;font-size:11px;color:#d4b48a;border-bottom:1px solid #d4b48a}
.shell{display:grid;grid-template-columns:268px 1fr 300px;min-height:0}
.col{background:var(--paper);min-height:0;display:flex;flex-direction:column}
.col.mid{background:#f4eee2}
.col + .col{border-left:1px solid var(--line)}
.head{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.head b{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;color:var(--mute)}
.plus{width:26px;height:26px;border:1px solid var(--line);display:grid;place-items:center;background:#fff;color:var(--mute)}
.list{padding:10px;overflow:auto}
.sess{padding:11px 12px;border:1px solid transparent;margin-bottom:6px}
.sess.on{background:#fff;border-color:var(--line);box-shadow:0 4px 12px rgba(40,30,10,.05)}
.sess .t{font-size:14px}
.sess .d{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--mute);margin-top:4px}
.sess.empty{border:1px dashed #c9beaa;color:var(--mute);text-align:center;padding:16px}
.chat{flex:1;display:flex;flex-direction:column;min-height:0}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px}
.mark{width:64px;height:64px;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:"ZCOOL XiaoWei",serif;font-size:30px;transform:rotate(-6deg);margin-bottom:16px;background:#fff}
.stage h2{font-family:"ZCOOL XiaoWei",serif;font-weight:400;font-size:30px;letter-spacing:.08em}
.stage p{color:var(--mute);max-width:420px;margin:10px 0 18px}
.hints{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.hint{border:1px dashed #c9beaa;padding:6px 12px;font-size:13px;color:var(--mute);background:rgba(255,255,255,.5)}
.composer{padding:14px;border-top:1px solid var(--line);background:rgba(255,253,247,.8)}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:flex-end;box-shadow:0 8px 20px rgba(40,30,10,.05)}
.box textarea{flex:1;border:0;resize:none;height:44px;font:inherit;outline:none;background:transparent}
.box button{background:#1a1612;color:#f6efe3;border:0;padding:10px 16px;font:inherit;cursor:pointer}
.ctx{padding:12px;overflow:auto}
.card{border:1px solid var(--line);background:#fff;padding:14px;margin-bottom:10px}
.card h4{font-size:13px;margin-bottom:8px}
.bar{height:8px;background:#efe6d6;margin:7px 0}
.tag{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;border:1px dashed #c9beaa;padding:2px 7px;color:var(--mute);margin-right:4px}
@media(max-width:980px){.shell{grid-template-columns:1fr}.col:first-child,.col:last-child{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="dot"></span><b>粤教 · 壳 C</b><span>CHAT WORKBENCH</span></div>
    <a href="00-总览.html">换壳</a>
  </header>
  <div class="shell">
    <aside class="col">
      <div class="head"><b>SESSIONS</b><span class="plus">+</span></div>
      <div class="list">
        <div class="sess on"><div class="t">新会话</div><div class="d">此刻 · 还没有消息</div></div>
        <div class="sess empty">历史会话槽</div>
        <div class="sess empty">后加：客服 / 企业 / 学生</div>
        <div class="sess empty">按日期归档槽</div>
      </div>
    </aside>
    <section class="col mid chat">
      <div class="head"><b>CANVAS · 主画布</b><span class="tag">模型槽</span></div>
      <div class="stage">
        <div class="mark">问</div>
        <h2>对话还是空的</h2>
        <p>选定这个壳以后，气泡画在这里。可以先放欢迎语、推荐问法，再接 Dify。</p>
        <div class="hints">
          <span class="hint">推荐问法槽 1</span>
          <span class="hint">推荐问法槽 2</span>
          <span class="hint">推荐问法槽 3</span>
        </div>
      </div>
      <div class="composer">
        <div class="box">
          <textarea placeholder="输入槽 · 后接 Dify / FastAPI" disabled></textarea>
          <button type="button">发送</button>
        </div>
      </div>
    </section>
    <aside class="col">
      <div class="head"><b>CONTEXT</b></div>
      <div class="ctx">
        <div class="card">
          <h4>当前意图槽</h4>
          <span class="tag">未识别</span>
          <div class="bar" style="width:40%"></div>
        </div>
        <div class="card">
          <h4>知识引用槽</h4>
          <div class="bar"></div>
          <div class="bar" style="width:70%"></div>
          <div class="bar" style="width:52%"></div>
        </div>
        <div class="card">
          <h4>关联记录槽</h4>
          <p style="color:var(--mute);font-size:13px">报名、客户、请假等落库结果以后钉在这里。</p>
        </div>
        <div class="card">
          <h4>安全 / 来源槽</h4>
          <p style="color:var(--mute);font-size:13px">防幻觉时展示「知识库没有」或引文编号。</p>
        </div>
      </div>
    </aside>
  </div>
</div>
</body>
</html>
