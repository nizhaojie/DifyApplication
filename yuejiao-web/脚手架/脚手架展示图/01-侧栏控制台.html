<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>脚手架 A · 侧栏控制台</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
:root{--ink:#14120f;--red:#c41e1e;--paper:#fffdf8;--bg:#f4efe6;--mute:#6f675b;--line:#d8cfbe}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Noto Serif SC",Songti SC,serif;background:var(--bg);color:var(--ink)}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:#16130e;color:#efe8db;display:flex;flex-direction:column;padding:18px 14px 16px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;border-bottom:1px solid #2e2a24}
.seal{width:32px;height:32px;border:1.5px solid #e24a4a;color:#e24a4a;display:grid;place-items:center;font-family:"ZCOOL XiaoWei",serif;font-size:18px;transform:rotate(-8deg)}
.brand b{font-family:"ZCOOL XiaoWei",serif;font-size:22px;font-weight:400;letter-spacing:.16em}
.brand small{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;color:#8d8476;letter-spacing:.12em}
.search{margin:16px 8px 8px;background:#1f1b16;border:1px solid #3a342b;padding:8px 10px;color:#8d8476;font-size:12px;font-family:"IBM Plex Mono",monospace}
.cap{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.22em;color:#8d8476;padding:14px 10px 6px}
.item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:#d9d0c2;font-size:14px}
.item:hover{background:#241f19}
.item.on{background:#c41e1e;color:#fff}
.item i{width:7px;height:7px;background:currentColor;transform:rotate(45deg);opacity:.7;flex:0 0 7px}
.slot{margin:6px 8px;border:1px dashed #4a4338;color:#8d8476;padding:9px;font-size:12px;text-align:center;border-radius:6px}
.side-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid #2e2a24;font-size:12px;color:#8d8476}
.main{display:flex;flex-direction:column;min-width:0}
.top{height:62px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 22px}
.crumb{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--mute);letter-spacing:.08em;flex:1}
.find{width:220px;border:1px solid var(--line);background:#fff;padding:7px 10px;font:inherit;font-size:13px;color:var(--mute)}
.icon{width:34px;height:34px;border:1px solid var(--line);display:grid;place-items:center;background:#fff;font-size:13px;color:var(--mute);position:relative}
.icon em{position:absolute;top:5px;right:6px;width:7px;height:7px;background:var(--red);border-radius:50%}
.avatar{width:34px;height:34px;background:#16130e;color:#fff;display:grid;place-items:center;font-family:"ZCOOL XiaoWei",serif}
.back{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--red);border-bottom:1px solid var(--red)}
.body{padding:26px 28px 48px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}
h1{font-family:"ZCOOL XiaoWei",serif;font-weight:400;font-size:32px;letter-spacing:.08em}
.sub{color:var(--mute);margin-top:6px;font-size:14px}
.btns{display:flex;gap:8px}
.btn{border:1.5px solid var(--ink);background:#fff;padding:8px 14px;font:inherit;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn.pri{background:var(--red);color:#fff;border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--paper);border:1px solid var(--line);padding:14px 16px}
.stat .n{font-family:"IBM Plex Mono",monospace;font-size:22px;color:#cfc4ad}
.stat .l{font-size:12px;color:var(--mute);margin-top:4px}
.panel{background:var(--paper);border:1px solid var(--line);box-shadow:0 10px 24px rgba(40,30,10,.05)}
.filters{display:flex;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip{border:1px dashed #b9ae98;color:var(--mute);padding:4px 10px;font-size:12px;background:#fff}
.chip.on{border-style:solid;border-color:var(--ink);color:var(--ink)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:11px 14px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;color:var(--mute);border-bottom:1px solid var(--line);background:#f7f1e6}
td{padding:13px 14px;border-bottom:1px dashed #e4dccd}
.sk{height:10px;background:linear-gradient(90deg,#efe8d8,#f7f1e6,#efe8d8);background-size:200% 100%;animation:sh 1.4s ease infinite;border-radius:3px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
.ops{color:#cfc4ad;font-family:"IBM Plex Mono",monospace;font-size:11px}
.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:var(--mute);font-size:12px}
.pages{display:flex;gap:6px}
.pages span{width:28px;height:28px;border:1px solid var(--line);display:grid;place-items:center;background:#fff}
.pages span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="seal">粤</div>
      <div><b>粤教</b><small>SHELL A</small></div>
    </div>
    <div class="search">搜索菜单…</div>
    <div class="cap">框架</div>
    <a class="item on" href="#"><i></i>工作台</a>
    <a class="item" href="#"><i></i>设置槽</a>
    <div class="cap">功能槽 · 后加</div>
    <div class="slot">模块菜单 01</div>
    <div class="slot">模块菜单 02</div>
    <div class="slot">模块菜单 03</div>
    <div class="slot">模块菜单 04</div>
    <div class="side-foot">侧栏可收起 · 角色槽：未指定</div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="crumb">控制台 / 工作台 / 列表骨架</div>
      <input class="find" placeholder="全局搜索槽" disabled>
      <div class="icon">铃<em></em></div>
      <div class="avatar">可</div>
      <a class="back" href="00-总览.html">换壳</a>
    </header>
    <div class="body">
      <div class="head">
        <div>
          <h1>空工作台</h1>
          <p class="sub">左菜单管模块，中间铺列表和表单。数字和行都是骨架，接入接口后替换。</p>
        </div>
        <div class="btns">
          <button class="btn" type="button">导出槽</button>
          <button class="btn pri" type="button">新建槽</button>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><div class="n">— —</div><div class="l">统计槽 A</div></div>
        <div class="stat"><div class="n">— —</div><div class="l">统计槽 B</div></div>
        <div class="stat"><div class="n">— —</div><div class="l">统计槽 C</div></div>
        <div class="stat"><div class="n">— —</div><div class="l">统计槽 D</div></div>
      </div>
      <div class="panel">
        <div class="filters">
          <span class="chip on">全部</span>
          <span class="chip">状态槽</span>
          <span class="chip">时间槽</span>
          <span class="chip">负责人槽</span>
        </div>
        <table>
          <thead><tr><th>名称</th><th>状态</th><th>更新</th><th>负责人</th><th></th></tr></thead>
          <tbody>
            <tr><td><div class="sk" style="width:46%"></div></td><td><div class="sk" style="width:28%"></div></td><td><div class="sk" style="width:40%"></div></td><td><div class="sk" style="width:30%"></div></td><td class="ops">查看 · 编辑</td></tr>
            <tr><td><div class="sk" style="width:58%"></div></td><td><div class="sk" style="width:22%"></div></td><td><div class="sk" style="width:36%"></div></td><td><div class="sk" style="width:34%"></div></td><td class="ops">查看 · 编辑</td></tr>
            <tr><td><div class="sk" style="width:38%"></div></td><td><div class="sk" style="width:32%"></div></td><td><div class="sk" style="width:44%"></div></td><td><div class="sk" style="width:24%"></div></td><td class="ops">查看 · 编辑</td></tr>
            <tr><td><div class="sk" style="width:62%"></div></td><td><div class="sk" style="width:20%"></div></td><td><div class="sk" style="width:30%"></div></td><td><div class="sk" style="width:40%"></div></td><td class="ops">查看 · 编辑</td></tr>
            <tr><td><div class="sk" style="width:50%"></div></td><td><div class="sk" style="width:26%"></div></td><td><div class="sk" style="width:38%"></div></td><td><div class="sk" style="width:28%"></div></td><td class="ops">查看 · 编辑</td></tr>
          </tbody>
        </table>
        <div class="pager">
          <span>共 — 条 · 每页 10</span>
          <div class="pages"><span class="on">1</span><span>2</span><span>3</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
